<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D2 SERVIÇOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--border:#334155;--primary:#4f46e5;--green:#16a34a;--yellow:#eab308}
*{box-sizing:border-box} body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;margin:0;padding-bottom:90px}
.btn{padding:14px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;width:100%}
.input{padding:14px;border:1px solid var(--border);border-radius:10px;width:100%;background:var(--card);color:var(--text);margin-bottom:8px}
.card{background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:10px}
.aba{display:none}.ativa{display:block}
.menu{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.menu button{background:transparent;border:none;color:var(--text);padding:8px 2px;font-size:9px;font-weight:bold;display:flex;flex-direction:column;align-items:center}
.menu button.on{background:var(--primary);color:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div id="telaLogin" style="position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px">
<div class="card" style="width:100%;max-width:380px"><h2 style="text-align:center">🛠️ D2 SERVIÇOS</h2>
<input id="loginUser" class="input" placeholder="Login"><input id="loginSenha" type="password" class="input" placeholder="Senha">
<button id="btnEntrar" class="btn" style="background:var(--primary);color:white">ENTRAR</button>
<p id="erroLogin" style="color:red;text-align:center"></p><div style="font-size:10px;text-align:center;color:#64748b">admin / 1234</div></div></div>
<div style="padding:10px">
<div id="aba-dash" class="aba ativa">
<div class="grid2">
<div class="card"><div style="color:#94a3b8;font-size:12px">FATURAMENTO</div><div id="statFat" class="stat">R$ 0,00</div></div>
<div class="card"><div style="color:#94a3b8;font-size:12px">ABERTAS</div><div id="statAbertas" class="stat" style="color:var(--yellow)">0</div></div>
</div>
<div class="card"><h3>📅 Agenda Hoje</h3><div id="agendaHoje"></div></div>
<div class="card"><h3>🚨 OS Abertas</h3><div id="listaDash"></div></div>
</div>
<div id="aba-clientes" class="aba">
<div class="card">
<h3>👤 Cliente</h3>
<input id="cNome" class="input" placeholder="Nome / Empresa">
<input id="cFone" class="input" placeholder="WhatsApp com DDD">
<input id="cEnd" class="input" placeholder="Endereço">
<input id="cObs" class="input" placeholder="Obs">
<button id="btnSalvarCliente" class="btn" style="background:var(--primary);color:white">SALVAR CLIENTE</button>
</div>
<input id="buscaCliente" class="input" placeholder="🔍 Buscar cliente...">
<div id="listaClientes"></div>
</div>

<div id="aba-os" class="aba">
<div class="card">
<h3>📝 Nova OS</h3>
<select id="osCliente" class="input"><option>Carregando clientes...</option></select>
<input id="osServico" class="input" placeholder="Serviço">
<div class="grid2"><input id="osValor" type="number" class="input" placeholder="Valor R$"><input id="osData" type="date" class="input"></div>
<input id="osHora" type="time" class="input">
<textarea id="osDesc" class="input" placeholder="Descrição detalhada"></textarea>
<select id="osStatus" class="input"><option value="aberto">🟡 ABERTO</option><option value="andamento">🔵 ANDAMENTO</option><option value="concluido">🟢 CONCLUÍDO</option></select>
<select id="osPagamento" class="input"><option value="pendente">💰 PENDENTE</option><option value="pago">✅ PAGO</option></select>
<button id="btnSalvarOS" class="btn" style="background:var(--green);color:white">💾 SALVAR OS</button>
</div>
<div id="listaOS"></div>
</div>

<div id="aba-agenda" class="aba">
<div class="card">
<h3>📅 Agendamento</h3>
<select id="agCliente" class="input"><option>Carregando...</option></select>
<input id="agData" type="date" class="input"><input id="agHora" type="time" class="input">
<input id="agServ" class="input" placeholder="Serviço">
<button id="btnSalvarAgenda" class="btn" style="background:var(--primary);color:white">AGENDAR</button>
</div>
<div id="listaAgenda"></div>
</div>
<div id="aba-fin" class="aba">
<div class="card"><h3>💰 Financeiro</h3>
<select id="finTipo" class="input"><option value="entrada">💚 ENTRADA</option><option value="saida">❤️ SAÍDA</option></select>
<input id="finDesc" class="input" placeholder="Descrição"><input id="finValor" type="number" class="input" placeholder="Valor">
<button id="btnSalvarFin" class="btn" style="background:var(--green);color:white">LANÇAR</button></div><div id="listaFin"></div></div>
</div>

<nav class="menu">
<button id="btn-dash" class="on" onclick="mostrarAba('aba-dash')">📊<span>DASH</span></button>
<button id="btn-clientes" onclick="mostrarAba('aba-clientes')">👥<span>CLIENTES</span></button>
<button id="btn-os" onclick="mostrarAba('aba-os')">📝<span>OS</span></button>
<button id="btn-agenda" onclick="mostrarAba('aba-agenda')">📅<span>AGENDA</span></button>
<button id="btn-fin" onclick="mostrarAba('aba-fin')">💰<span>FIN</span></button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAsVGIZfJxaCqFk4KJEU0I4_R5_-MBdVoo", authDomain: "servicos-cd9e2.firebaseapp.com", projectId: "servicos-cd9e2", storageBucket: "servicos-cd9e2.firebasestorage.app", messagingSenderId: "45086093375", appId: "1:45086093375:web:641ffeb22aca5fd0f2888a" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let clientes=[], listaOS=[], listaAgenda=[], editandoOS=null, editandoCliente=null;

$('btnEntrar').onclick=()=>{ if($('loginUser').value==='admin'&&$('loginSenha').value==='1234') $('telaLogin').style.display='none'; else $('erroLogin').textContent='Erro'; }
window.mostrarAba=(id)=>{ document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on')); $(id).classList.add('ativa'); $('btn-'+id.replace('aba-','')).classList.add('on'); }

onSnapshot(collection(db,"clientes"), snap=>{ clientes=[]; snap.forEach(d=>clientes.push({id:d.id,...d.data()})); atualizar() });
onSnapshot(collection(db,"os"), snap=>{ listaOS=[]; snap.forEach(d=>listaOS.push({id:d.id,...d.data()})); atualizar() });
onSnapshot(collection(db,"agenda"), snap=>{ listaAgenda=[]; snap.forEach(d=>listaAgenda.push({id:d.id,...d.data()})); atualizar() });

$('btnSalvarCliente').onclick=async()=>{ 
  if(!$('cNome').value) return alert('Nome');
  const dados={nome:$('cNome').value,fone:$('cFone').value,end:$('cEnd').value,obs:$('cObs').value};
  if(editandoCliente){ await updateDoc(doc(db,"clientes",editandoCliente),dados); editandoCliente=null; $('btnSalvarCliente').textContent='SALVAR CLIENTE'; }
  else { await addDoc(collection(db,"clientes"),dados); }
  $('cNome').value='';$('cFone').value='';$('cEnd').value='';$('cObs').value='';
}
$('btnSalvarOS').onclick=async()=>{ 
  if(!$('osCliente').value) return alert('Cliente'); 
  const dados={cliente:$('osCliente').value,servico:$('osServico').value,valor:parseFloat($('osValor').value)||0,data:$('osData').value,hora:$('osHora').value,desc:$('osDesc').value,status:$('osStatus').value,pag:$('osPagamento').value};
  if(editandoOS){ await updateDoc(doc(db,"os",editandoOS),dados); editandoOS=null; $('btnSalvarOS').textContent='💾 SALVAR OS'; }
  else { await addDoc(collection(db,"os"),dados); }
  alert('Salvo!'); 
}
$('btnSalvarAgenda').onclick=async()=>{ await addDoc(collection(db,"agenda"),{cliente:$('agCliente').value,data:$('agData').value,hora:$('agHora').value,serv:$('agServ').value}); alert('Agendado!'); }
$('btnSalvarFin').onclick=async()=>{ await addDoc(collection(db,"financeiro"),{tipo:$('finTipo').value,desc:$('finDesc').value,valor:parseFloat($('finValor').value)||0}); alert('Lançado!'); }

// CLIENTES
window.excluirCliente=async(id)=>{ if(confirm('Excluir cliente?')) await deleteDoc(doc(db,"clientes",id)); }
window.editarCliente=(id)=>{ const c=clientes.find(x=>x.id===id); $('cNome').value=c.nome; $('cFone').value=c.fone; $('cEnd').value=c.end; $('cObs').value=c.obs; editandoCliente=id; $('btnSalvarCliente').textContent='✏️ ATUALIZAR CLIENTE'; mostrarAba('aba-clientes'); window.scrollTo(0,0); }

// OS
window.excluirOS=async(id)=>{ if(confirm('Excluir OS?')) await deleteDoc(doc(db,"os",id)); }
window.editarOS=(id)=>{ const o=listaOS.find(x=>x.id===id); $('osCliente').value=o.cliente; $('osServico').value=o.servico; $('osValor').value=o.valor; $('osData').value=o.data; $('osHora').value=o.hora||''; $('osDesc').value=o.desc; $('osStatus').value=o.status; $('osPagamento').value=o.pag; editandoOS=id; $('btnSalvarOS').textContent='✏️ ATUALIZAR OS'; mostrarAba('aba-os'); }

// PDF + WHATSAPP
window.pdfZapOS=(id)=>{
  const o=listaOS.find(x=>x.id===id);
  const { jsPDF } = window.jspdf;
  const docPDF = new jsPDF();
  docPDF.setFontSize(18); docPDF.text("D2 SERVICOS - ORDEM DE SERVICO",10,15);
  docPDF.setFontSize(12);
  docPDF.text(`Cliente: ${o.cliente}`,10,30);
  docPDF.text(`Servico: ${o.servico}`,10,40);
  docPDF.text(`Valor: R$ ${o.valor}`,10,50);
  docPDF.text(`Data: ${o.data} ${o.hora||''}`,10,60);
  docPDF.text(`Status: ${o.status} | Pagamento: ${o.pag}`,10,70);
  docPDF.text("Descricao:",10,80);
  const linhas = docPDF.splitTextToSize(o.desc||'',180);
  docPDF.text(linhas,10,90);
  docPDF.text("___________________________________",10,150);
  docPDF.text("Assinatura do Cliente",10,160);
  const nomeArq = `OS_${o.cliente}_${o.data}.pdf`;
  docPDF.save(nomeArq);
  
  // Abre WhatsApp logo depois
  setTimeout(()=>{
    const cli=clientes.find(c=>c.nome===o.cliente);
    const fone=cli?cli.fone.replace(/\D/g,''):''; 
    const msg=`*D2 SERVICOS - OS em PDF*%0A👤 ${o.cliente}%0A🔧 ${o.servico}%0A💰 R$ ${o.valor}%0A📅 ${o.data}%0A%0A_PDF baixado: ${nomeArq} - Anexe aqui no WhatsApp_`;
    const url=fone?`https://wa.me/55${fone}?text=${msg}`:`https://wa.me/?text=${msg}`;
    window.open(url,'_blank');
  },800);
}

function atualizar(){
  let html='<option value="">Selecione Cliente</option>'; clientes.forEach(c=>html+=`<option value="${c.nome}">${c.nome}</option>`);
  $('osCliente').innerHTML=html; $('agCliente').innerHTML=html;

  $('listaClientes').innerHTML=clientes.map(c=>`<div class="card"><b>${c.nome}</b><br><small>📱 ${c.fone} | ${c.end||''}</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px"><button onclick="editarCliente('${c.id}')" style="padding:8px;border-radius:8px;border:none;background:#4f46e5;color:white">✏️ Editar</button><button onclick="excluirCliente('${c.id}')" style="padding:8px;border-radius:8px;border:none;background:#dc2626;color:white">🗑️ Excluir</button></div></div>`).join('')||'<div class="card">Nenhum cliente</div>';

  $('listaOS').innerHTML=listaOS.map(o=>`<div class="card"><b>${o.cliente}</b> - ${o.servico}<br>R$ ${o.valor} | ${o.status}<br><small>${o.data} ${o.hora||''}</small><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:8px"><button onclick="pdfZapOS('${o.id}')" style="padding:8px;border-radius:8px;border:none;background:#25D366;color:white;font-weight:bold">📄 PDF+Zap</button><button onclick="editarOS('${o.id}')" style="padding:8px;border-radius:8px;border:none;background:#4f46e5;color:white">✏️</button><button onclick="excluirOS('${o.id}')" style="padding:8px;border-radius:8px;border:none;background:#dc2626;color:white">🗑️</button><button onclick="window.open('https://wa.me/?text=OS ${o.cliente}','_blank')" style="padding:8px;border-radius:8px;border:none;background:#334155;color:white">📱</button></div></div>`).join('')||'<div class="card">Nenhuma OS</div>';

  $('listaAgenda').innerHTML=listaAgenda.map(a=>`<div class="card">${a.data} ${a.hora} - ${a.cliente}</div>`).join('')||'<div class="card">Nenhum agendamento</div>';
  $('agendaHoje').innerHTML=listaAgenda.length?listaAgenda.map(a=>`<div>📅 ${a.data} ${a.hora} - ${a.cliente}</div>`).join(''):'Nenhum agendamento hoje';
  $('listaDash').innerHTML=listaOS.filter(o=>o.status==='aberto').length?listaOS.filter(o=>o.status==='aberto').map(o=>`<div>🚨 ${o.cliente} - ${o.servico} R$ ${o.valor}</div>`).join(''):'Tudo em dia!';
  $('statAbertas').textContent=listaOS.filter(o=>o.status==='aberto').length;
  $('statFat').textContent='R$ '+listaOS.reduce((s,o)=>s+(parseFloat(o.valor)||0),0).toFixed(2);
}
$('buscaCliente').addEventListener('input', e=>{ let f=e.target.value.toLowerCase(); $('listaClientes').innerHTML=clientes.filter(c=>c.nome.toLowerCase().includes(f)).map(c=>`<div class="card"><b>${c.nome}</b><br><small>${c.fone}</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px"><button onclick="editarCliente('${c.id}')" style="padding:8px;border-radius:8px;border:none;background:#4f46e5;color:white">✏️ Editar</button><button onclick="excluirCliente('${c.id}')" style="padding:8px;border-radius:8px;border:none;background:#dc2626;color:white">🗑️ Excluir</button></div></div>`).join(''); });
</script>
</body>
</html>
